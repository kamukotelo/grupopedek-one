list.innerHTML=filtered.map(v=>{const choice=decisions[v.id]||'pending';const gallery=(arr,max)=>arr.slice(0,max).map(url=>'<a href="'+url+'" target="_blank"><img loading="lazy" src="'+url+'" alt="'+v.name+'"></a>').join('');return '<article class="vehicle" data-choice="'+choice+'"><div class="head"><div><h2>'+v.name+'</h2><p>'+v.brand+' · '+v.model+' · ID: '+v.id+'</p></div><span class="badge">'+labels[choice]+'</span></div><div class="compare"><section class="column"><h3>Acervo atual · '+v.current.length+' imagens</h3><div class="images">'+gallery(v.current,4)+'</div></section><section class="column"><h3>Proposta de upgrade · '+v.upgrade.length+' opções</h3><div class="images">'+(v.upgrade.length?gallery(v.upgrade,4):'<div class="empty">Upgrade ainda não gerado para este modelo</div>')+'</div></section></div><div class="decision"><button data-id="'+v.id+'" data-choice="upgrade" '+(!v.upgrade.length?'disabled':'')+'>✓ Usar upgrade</button><button data-id="'+v.id+'" data-choice="keep">Manter atual</button><button data-id="'+v.id+'" data-choice="cleanup">Limpar fundo</button><button data-id="'+v.id+'" data-choice="review">Rever</button></div></article>'}).join('');list.querySelectorAll('button[data-choice]').forEach(b=>{if(decisions[b.dataset.id]===b.dataset.choice)b.classList.add('selected');b.onclick=()=>choose(b.dataset.id,b.dataset.choice)})}
[search,filter].forEach(el=>el.addEventListener('input',render));document.querySelector('#export').onclick=()=>{const plan={version:'beta-1',createdAt:new Date().toISOString(),summary:{total:47},vehicles:vehicles.map(v=>({id:v.id,name:v.name,decision:decisions[v.id]||'pending',currentImages:v.current,upgradeImages:v.upgrade}))};const blob=new Blob([JSON.stringify(plan,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='pepek-plano-migracao-beta.json';a.click();URL.revokeObjectURL(a.href)};document.querySelector('#reset').onclick=()=>{if(confirm('Limpar todas as decisões da beta?')){localStorage.removeItem(key);Object.keys(decisions).forEach(k=>delete decisions[k]);render()}};render();
</script></body></html>
